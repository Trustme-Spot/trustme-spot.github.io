n.":"Earn points for every check-in, review and referral. Silver and Gold members get lower deposits and longer holds.","Theo d\xF5i qu\xE1n y\xEAu th\xEDch":"Follow your favourite caf\xE9s","L\u01B0u qu\xE1n, theo d\xF5i \u0111\u1EC3 nh\u1EADn th\xF4ng b\xE1o khi qu\xE1n \u0111\u0103ng \u01B0u \u0111\xE3i m\u1EDBi; \u01B0u \u0111\xE3i c\xF3 th\u1EC3 g\u1EAFn ngay v\xE0o l\u01B0\u1EE3t \u0111\u1EB7t.":"Save caf\xE9s and follow them to hear about new offers; an offer can be attached straight to a booking.","Ti\u1EC1n c\u1ECDc minh b\u1EA1ch t\u1EEBng b\u01B0\u1EDBc":"A transparent deposit, step by step","C\u1ECDc ch\u1EC9 \u0111\u1EC3 gi\u1EEF ch\u1ED7 cho b\u1EA1n. B\u1EA1n lu\xF4n bi\u1EBFt ti\u1EC1n \u0111ang \u1EDF \u0111\xE2u: \u0111ang gi\u1EEF, \u0111ang ho\xE0n hay \u0111\xE3 ho\xE0n. N\u1EBFu kh\xF4ng \u0111\u1EBFn trong th\u1EDDi gian gi\u1EEF ch\u1ED7, ch\u1ED7 \u0111\u01B0\u1EE3c nh\u1EA3 cho ng\u01B0\u1EDDi kh\xE1c v\xE0 c\u1ECDc \xE1p d\u1EE5ng theo ch\xEDnh s\xE1ch qu\xE1n ghi r\xF5 tr\u01B0\u1EDBc khi \u0111\u1EB7t.":"The deposit only holds your seat. You always know where the money is: held, being refunded or refunded. If you don't show up during the hold time, the seat goes to someone else and the deposit follows the caf\xE9's policy, shown before you book.","v\xED MoMo":"MoMo wallet","trong 24 gi\u1EDD":"within 24 hours","qu\xE1n \u1EDF":"caf\xE9s in","khu v\u1EF1c":"areas","Danh s\xE1ch do nh\xF3m kh\u1EA3o s\xE1t th\u1EF1c t\u1EBF t\u1EA1i TP. H\u1ED3 Ch\xED Minh,":"Surveyed in person by our team in Ho Chi Minh City,","qu\xE1n \u0111\xE3 c\xF3 \u1EA3nh. Ph\u1EA1m vi s\u1EBD m\u1EDF r\u1ED9ng ra c\xE1c t\u1EC9nh mi\u1EC1n Nam.":"caf\xE9s have photos so far. Coverage will expand to other southern provinces.","Xem tr\xEAn b\u1EA3n \u0111\u1ED3":"View on map","Cho ch\u1EE7 qu\xE1n: l\u1EA5p \u0111\u1EA7y gi\u1EDD th\u1EA5p \u0111i\u1EC3m, b\u1EDBt kh\xE1ch gi\u1EEF ch\u1ED7 r\u1ED3i kh\xF4ng \u0111\u1EBFn":"For caf\xE9 owners: fill off-peak hours and cut no-shows","Ti\u1EC1n c\u1ECDc nh\u1ECF gi\xFAp kh\xE1ch \u0111\u1EBFn \u0111\xFAng h\u1EB9n. Dashboard cho qu\xE1n bi\u1EBFt tr\u01B0\u1EDBc h\xF4m nay ai \u0111\u1EBFn, ng\u1ED3i \u0111\xE2u, bao l\xE2u, v\xE0 t\u1EF1 ho\xE0n c\u1ECDc khi kh\xE1ch check-out.":"A small deposit gets guests to arrive on time. The dashboard tells the caf\xE9 who is coming today, where they sit and for how long, and refunds deposits automatically at check-out.","T\xE0i kho\u1EA3n demo: chuquan@trustmespot.vn \xB7 m\u1EADt kh\u1EA9u 123456":"Demo account: chuquan@trustmespot.vn \xB7 password 123456","S\u01A1 \u0111\u1ED3 ch\u1ED7 ng\u1ED3i k\xE9o-th\u1EA3":"Drag-and-drop seat map","Th\xEAm, kh\xF3a t\u1EA1m, g\xE1n ti\u1EC7n \xEDch v\xE0 ph\u1EE5 thu cho t\u1EEBng gh\u1EBF.":"Add seats, lock them temporarily, set amenities and surcharges per seat.","Qu\xE9t QR check-in":"QR check-in","Check-out m\u1ED9t ch\u1EA1m, h\u1EC7 th\u1ED1ng t\u1EF1 t\u1EA1o l\u1EC7nh ho\xE0n c\u1ECDc.":"One-tap check-out; the system creates the refund automatically.","T\u1EF1 \u0111\u1EB7t lu\u1EADt gi\u1EEF ch\u1ED7":"Set your own hold rules","M\u1EE9c c\u1ECDc, 15\u201330 ph\xFAt gi\u1EEF ch\u1ED7, h\u1EA1n h\u1EE7y, ch\xEDnh s\xE1ch khi kh\xE1ch kh\xF4ng \u0111\u1EBFn.":"Deposit amount, 15\u201330 minute hold, cancellation deadline, no-show policy.","\u01AFu \u0111\xE3i ri\xEAng c\u1EE7a qu\xE1n":"Your own caf\xE9 offers","Gi\u1EA3m gi\xE1 theo khung gi\u1EDD, combo nh\xF3m, mi\u1EC5n c\u1ECDc kh\xE1ch m\u1EDBi.":"Time-slot discounts, group combos, no deposit for new guests.","Th\u1ED1ng k\xEA g\u1ECDn":"Simple stats","L\u01B0\u1EE3t \u0111\u1EB7t, t\u1EC9 l\u1EC7 \u0111\u1EBFn, gi\u1EDD cao \u0111i\u1EC3m, \u0111i\u1EC3m \u0111\xE1nh gi\xE1.":"Bookings, show-up rate, peak hours, rating.","\u0110\xE1nh gi\xE1 \u0111\xE1ng tin":"Reviews you can trust","Ch\u1EC9 kh\xE1ch \u0111\xE3 check-in m\u1EDBi \u0111\xE1nh gi\xE1 \u0111\u01B0\u1EE3c.":"Only guests who checked in can review.","TrustMe Spot l\xE0 n\u1EC1n t\u1EA3ng trung gian k\u1EBFt n\u1ED1i ng\u01B0\u1EDDi c\u1EA7n ch\u1ED7 h\u1ECDc, ch\u1ED7 l\xE0m vi\u1EC7c y\xEAn t\u0129nh v\u1EDBi c\xE1c qu\xE1n c\xE0 ph\xEA v\xE0 kh\xF4ng gian l\xE0m vi\u1EC7c chung \u1EDF mi\u1EC1n Nam Vi\u1EC7t Nam. Ba nh\xF3m ng\u01B0\u1EDDi d\xF9ng: kh\xE1ch t\xECm v\xE0 \u0111\u1EB7t ch\u1ED7, ch\u1EE7 qu\xE1n qu\u1EA3n l\xFD s\u01A1 \u0111\u1ED3 v\xE0 l\u01B0\u1EE3t \u0111\u1EB7t, qu\u1EA3n tr\u1ECB vi\xEAn gi\u1EEF ti\u1EC1n c\u1ECDc, x\u1EED l\xFD ho\xE0n c\u1ECDc v\xE0 ch\u01B0\u01A1ng tr\xECnh t\xEDch \u0111i\u1EC3m.":"TrustMe Spot is a marketplace that connects people who need a quiet place to study or work with caf\xE9s and coworking spaces in southern Vietnam. Three groups of users: guests find and book seats, caf\xE9 owners manage seat maps and bookings, and admins hold deposits, process refunds and run the rewards programme.","Ph\u1EA1m vi: TP. H\u1ED3 Ch\xED Minh, \u0110\u1ED3ng Nai, T\xE2y Ninh, C\u1EA7n Th\u01A1, V\u0129nh Long, \u0110\u1ED3ng Th\xE1p, An Giang, C\xE0 Mau theo \u0111\u1ECBa gi\u1EDBi h\xE0nh ch\xEDnh m\u1EDBi. Giai \u0111o\u1EA1n \u0111\u1EA7u t\u1EADp trung kh\u1EA3o s\xE1t qu\xE1n t\u1EA1i TP. H\u1ED3 Ch\xED Minh.":"Coverage: Ho Chi Minh City, \u0110\u1ED3ng Nai, T\xE2y Ninh, C\u1EA7n Th\u01A1, V\u0129nh Long, \u0110\u1ED3ng Th\xE1p, An Giang and C\xE0 Mau under the new administrative boundaries. The first phase focuses on surveying caf\xE9s in Ho Chi Minh City.","Ti\u1EBFn \u0111\u1ED9":"Progress","H\u1EC7 th\u1ED1ng thi\u1EBFt k\u1EBF":"Design system","M\xE0u, ch\u1EEF, 16 th\xE0nh ph\u1EA7n giao di\u1EC7n, s\u01A1 \u0111\u1ED3 gh\u1EBF ki\u1EC3u r\u1EA1p phim.":"Colours, type, 16 UI components, a cinema-style seat map.","Lu\u1ED3ng kh\xE1ch ho\xE0n ch\u1EC9nh":"Complete guest flow","T\xECm qu\xE1n \u2192 ch\u1ECDn gh\u1EBF \u2192 \u0111\u1EB7t c\u1ECDc \u2192 v\xE9 QR \u2192 check-in/out \u2192 ho\xE0n c\u1ECDc \u2192 t\xEDch \u0111i\u1EC3m.":"Find a caf\xE9 \u2192 pick a seat \u2192 deposit \u2192 QR ticket \u2192 check-in/out \u2192 refund \u2192 points.","Dashboard ch\u1EE7 qu\xE1n & admin":"Owner & admin dashboards","Qu\u1EA3n l\xFD s\u01A1 \u0111\u1ED3, check-in, \u01B0u \u0111\xE3i, c\xE0i \u0111\u1EB7t c\u1ECDc; theo d\xF5i ho\xE0n c\u1ECDc, ng\u01B0\u1EDDi d\xF9ng, kho qu\xE0, khi\u1EBFu n\u1EA1i.":"Seat maps, check-in, offers, deposit settings; refund tracking, users, gift store, complaints.","Kh\u1EA3o s\xE1t {0} qu\xE1n th\u1EADt":"{0} real caf\xE9s surveyed","{0} \u1EA3nh th\u1EF1c t\u1EBF, \u0111\u1ECBa ch\u1EC9 quy \u0111\u1ED5i theo ph\u01B0\u1EDDng m\u1EDBi.":"{0} real photos, addresses converted to the new wards.","H\u1EE3p t\xE1c v\u1EDBi qu\xE1n":"Partner with caf\xE9s","M\u1EDDi c\xE1c qu\xE1n \u0111\xE3 kh\u1EA3o s\xE1t l\xE0m \u0111\u1ED1i t\xE1c, x\xE1c minh gi\u1EDD m\u1EDF c\u1EEDa, s\u01A1 \u0111\u1ED3 gh\u1EBF, menu.":"Invite the surveyed caf\xE9s to join, verify opening hours, seat maps and menus.","Ch\u1EA1y th\u1EADt":"Go live","\u0110\u01B0a l\xEAn hosting, n\u1ED1i c\u01A1 s\u1EDF d\u1EEF li\u1EC7u Supabase, c\u1ED5ng thanh to\xE1n VNPay/MoMo/ZaloPay th\u1EADt.":"Deploy to hosting, connect a Supabase database and real VNPay/MoMo/ZaloPay payments.","Ti\u1EBFp theo":"Next","C\xF4ng ngh\u1EC7: React, Tailwind CSS, h\u1EC7 th\u1ED1ng thi\u1EBFt k\u1EBF ri\xEAng; d\u1EEF li\u1EC7u demo l\u01B0u tr\xEAn tr\xECnh duy\u1EC7t, s\u1EB5n schema cho Supabase; b\u1EA3n \u0111\u1ED3 Leaflet + OpenStreetMap; thanh to\xE1n gi\u1EA3 l\u1EADp t\xE1ch module.":"Tech: React, Tailwind CSS, our own design system; demo data stored in the browser with a Supabase schema ready; Leaflet + OpenStreetMap maps; simulated payments in a separate module.","Ti\u1EC1n c\u1ECDc l\xE0 bao nhi\xEAu v\xE0 khi n\xE0o \u0111\u01B0\u1EE3c ho\xE0n?":"How much is the deposit and when do I get it back?","M\u1ED7i qu\xE1n t\u1EF1 \u0111\u1EB7t m\u1EE9c c\u1ECDc, th\u01B0\u1EDDng 20.000\u201350.000\u0111 m\u1ED7i ch\u1ED7. Khi qu\xE1n x\xE1c nh\u1EADn b\u1EA1n \u0111\xE3 d\xF9ng xong (check-out), ti\u1EC1n c\u1ECDc t\u1EF1 ho\xE0n v\u1EC1 v\xED ho\u1EB7c t\xE0i kho\u1EA3n b\u1EA1n \u0111\xE3 thanh to\xE1n trong v\xF2ng 24 gi\u1EDD.":"Each caf\xE9 sets its own deposit, usually 20,000\u201350,000\u20AB per seat. When the caf\xE9 confirms you're done (check-out), the deposit goes back to the wallet or account you paid with within 24 hours.","N\u1EBFu t\xF4i \u0111\u1EBFn tr\u1EC5 ho\u1EB7c kh\xF4ng \u0111\u1EBFn th\xEC sao?":"What if I'm late or don't show up?","Ch\u1ED7 \u0111\u01B0\u1EE3c gi\u1EEF 15\u201330 ph\xFAt t\xEDnh t\u1EEB gi\u1EDD h\u1EB9n, t\xF9y qu\xE1n. Qu\xE1 th\u1EDDi gian \u0111\xF3 m\xE0 ch\u01B0a check-in th\xEC ch\u1ED7 \u0111\u01B0\u1EE3c nh\u1EA3 cho ng\u01B0\u1EDDi kh\xE1c, c\u1ECDc kh\xF4ng ho\xE0n ho\u1EB7c ho\xE0n m\u1ED9t ph\u1EA7n theo ch\xEDnh s\xE1ch qu\xE1n ghi r\xF5 tr\u01B0\u1EDBc khi b\u1EA1n \u0111\u1EB7t. H\u1EE7y tr\u01B0\u1EDBc h\u1EA1n h\u1EE7y mi\u1EC5n ph\xED th\xEC \u0111\u01B0\u1EE3c ho\xE0n \u0111\u1EE7.":"Seats are held for 15\u201330 minutes from your booked time, depending on the caf\xE9. If you haven't checked in by then, the seat is released and the deposit is not refunded or partly refunded under the caf\xE9's policy, shown before you book. Cancel before the free-cancellation deadline for a full refund.","\u0110\xE1nh gi\xE1 tr\xEAn TrustMe Spot c\xF3 \u0111\xE1ng tin kh\xF4ng?":"Can I trust the reviews on TrustMe Spot?","Ch\u1EC9 kh\xE1ch \u0111\xE3 check-in th\xE0nh c\xF4ng qua TrustMe Spot m\u1EDBi vi\u1EBFt \u0111\u01B0\u1EE3c \u0111\xE1nh gi\xE1, m\u1ED7i l\u01B0\u1EE3t m\u1ED9t l\u1EA7n, v\xE0 \u0111\xE1nh gi\xE1 \u0111\u01B0\u1EE3c g\u1EAFn nh\xE3n \u201C\u0110\xE3 \u0111\u1EBFn qu\xE1n\u201D.":'Only guests who successfully checked in through TrustMe Spot can write a review, once per visit, and each review is labelled "Visited".',"C\xE1c qu\xE1n tr\xEAn web \u0111\xE3 h\u1EE3p t\xE1c v\u1EDBi TrustMe Spot ch\u01B0a?":"Are the caf\xE9s on this site TrustMe Spot partners?","Ch\u01B0a. \u0110\xE2y l\xE0 b\u1EA3n demo. T\xEAn, \u0111\u1ECBa ch\u1EC9, li\xEAn k\u1EBFt v\xE0 \u1EA3nh c\u1EE7a qu\xE1n do nh\xF3m kh\u1EA3o s\xE1t v\xE0 t\u1ED5ng h\u1EE3p; gi\u1EDD m\u1EDF c\u1EEDa, ti\u1EC7n \xEDch, s\u01A1 \u0111\u1ED3 gh\u1EBF v\xE0 ti\u1EC1n c\u1ECDc hi\u1EC7n l\xE0 minh h\u1ECDa. \u0110\u1EB7t ch\u1ED7 tr\xEAn b\u1EA3n demo l\xE0 \u0111\u1EB7t th\u1EED, qu\xE1n kh\xF4ng nh\u1EADn \u0111\u01B0\u1EE3c v\xE0 kh\xF4ng c\xF3 ti\u1EC1n th\u1EADt \u0111\u01B0\u1EE3c tr\u1EEB.":"Not yet. This is a demo. Caf\xE9 names, addresses, links and photos were surveyed and collected by our team; opening hours, amenities, seat maps and deposits are illustrations. Bookings on the demo are test bookings: the caf\xE9 does not receive them and no real money is charged.","T\xF4i l\xE0 ch\u1EE7 qu\xE1n, mu\u1ED1n tham gia th\xEC l\xE0m th\u1EBF n\xE0o?":"I own a caf\xE9. How do I join?","B\u1EA1n c\xF3 th\u1EC3 xem tr\u01B0\u1EDBc dashboard demo b\u1EB1ng t\xE0i kho\u1EA3n chuquan@trustmespot.vn (m\u1EADt kh\u1EA9u 123456). Khi TrustMe Spot m\u1EDF \u0111\u0103ng k\xFD \u0111\u1ED1i t\xE1c, qu\xE1n g\u1EEDi h\u1ED3 s\u01A1 v\xE0 \u0111\u01B0\u1EE3c duy\u1EC7t tr\u01B0\u1EDBc khi l\xEAn trang.":"You can preview the demo dashboard with chuquan@trustmespot.vn (password 123456). When TrustMe Spot opens partner sign-ups, caf\xE9s submit an application and are reviewed before going live.","H\xF4m nay b\u1EA1n mu\u1ED1n ng\u1ED3i \u1EDF \u0111\xE2u?":"Where do you want to sit today?","M\u1EDF b\u1EA3n \u0111\u1ED3":"Open map","D\u1EF1 \xE1n demo \xB7 T\xECm v\xE0 \u0111\u1EB7t ch\u1ED7 qu\xE1n c\xE0 ph\xEA l\xE0m vi\u1EC7c y\xEAn t\u0129nh.":"Demo project \xB7 Find and book seats at quiet work-friendly caf\xE9s.","\u1EA2nh qu\xE1n do nh\xF3m t\u1ED5ng h\u1EE3p t\u1EEB trang c\u1EE7a c\xE1c qu\xE1n, ch\u1EC9 d\xF9ng cho m\u1EE5c \u0111\xEDch gi\u1EDBi thi\u1EC7u d\u1EF1 \xE1n.":"Caf\xE9 photos were collected by our team from the caf\xE9s' own pages and are used only to present t
